[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["evals/lint", "typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"toybox/cli.py" = ["S603"]
"toybox/voice_env.py" = ["S603", "S310"]
"evals/shots/*/shot.py" = ["INP001"]
"evals/probes/*.py" = ["INP001"]
"videos/*/shot.py" = ["INP001"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
failOnWarnings = true
include = ["."]
stubPath = "typings"
exclude = ["evals/lint", "out", "**/__pycache__"]
reportMissingModuleSource = false
