<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="ui-components.css">
<style>
  body { display: grid; grid-template-columns: minmax(280px, 26rem) 1fr; height: 100vh; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; } }
  aside { display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); min-height: 0; padding: var(--space-4); gap: var(--space-3); }
  aside h1 { font-size: var(--title); margin: 0; }
  #log { flex: 1; overflow: auto; min-height: 8rem; display: flex; flex-direction: column; gap: var(--space-3); }
  #log p { margin: 0; white-space: pre-wrap; }
  #log .me { color: var(--muted); }
  #log .tool { color: var(--muted); font: var(--small)/1.3 var(--sans); }
  form { display: flex; flex-direction: column; gap: var(--space-2); }
  textarea { width: 100%; min-height: 5.5rem; padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--text); }
  section { display: flex; flex-direction: column; padding: var(--space-4); min-height: 0; overflow: auto; }
  .stage { aspect-ratio: 16 / 9; width: 100%; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
</style>
</head>
<body>
<aside aria-label="Chat">
  <h1>Toybox</h1>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form">
    <label for="msg" class="note">Tell Toybox what to build or change</label>
    <textarea id="msg" placeholder="For example: a street at night with a taxi and three people"></textarea>
    <div class="row"><button class="primary" id="send" type="submit">Send</button><button type="button" id="stop">Stop</button></div>
  </form>
</aside>
<section>
  <div class="stage" id="stage">
    <canvas id="canvas" tabindex="0" aria-label="3D scene. Drag to orbit, scroll to zoom, shift and drag to pan. Arrow keys orbit. Space plays."></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
  </div>
  <div class="bar">
    <button id="play" class="primary" aria-label="Play">Play</button>
    <input id="seek" type="range" min="0" max="60" step="0.05" value="0" aria-label="Time">
    <span id="time" class="time">0.0 / 0.0 s</span>
    <button id="story">Story camera</button>
  </div>
  <div class="panel" id="panel" hidden>
    <span class="name" id="pname"></span>
    <button data-op="left">Left</button><button data-op="right">Right</button>
    <button data-op="fwd">Back</button><button data-op="back">Forward</button>
    <button data-op="bigger">Bigger</button><button data-op="smaller">Smaller</button>
    <button data-op="rotl">Turn left</button><button data-op="rotr">Turn right</button>
    <button data-op="flip">Flip</button><button data-op="duplicate">Duplicate</button>
    <button data-op="delete">Delete</button><button data-op="undo">Undo</button>
    <span class="src" id="psrc"></span>
  </div>
  <div class="bar">
    <button id="mp4">Export MP4</button>
    <button id="save">Save scene file</button>
    <span id="status" class="note" role="status"></span>
  </div>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
